<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#141527"/>
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.4"/>
    </linearGradient>
    <pattern id="ml-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#ml-bg)"/>
  <rect width="800" height="450" fill="url(#ml-grid)"/>

  <!-- Model Pipeline Card -->
  <rect x="120" y="60" width="560" height="330" rx="14" fill="#0F1322" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top bar -->
  <text x="150" y="95" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">PREDICTIVE ANALYTICS ENGINE</text>
  <rect x="520" y="80" width="135" height="24" rx="12" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)"/>
  <text x="587" y="96" fill="#C084FC" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SCIKIT-LEARN</text>

  <!-- Line Chart / Scatter Plot -->
  <g transform="translate(150, 130)">
    <!-- Axes -->
    <line x1="0" y1="210" x2="320" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="210" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Regression / Forecast curve -->
    <path d="M 10 180 C 60 160, 120 190, 160 120 C 200 60, 260 90, 310 40" fill="none" stroke="#3B82F6" stroke-width="3"/>
    
    <!-- Area under curve -->
    <path d="M 10 180 C 60 160, 120 190, 160 120 C 200 60, 260 90, 310 40 L 310 210 L 10 210 Z" fill="url(#chart-grad)"/>

    <!-- Data scatter points -->
    <circle cx="40" cy="170" r="4" fill="#60A5FA"/>
    <circle cx="70" cy="155" r="4" fill="#60A5FA"/>
    <circle cx="105" cy="180" r="4" fill="#60A5FA"/>
    <circle cx="140" cy="140" r="4" fill="#A78BFA"/>
    <circle cx="180" cy="100" r="4" fill="#A78BFA"/>
    <circle cx="220" cy="70" r="4" fill="#A78BFA"/>
    <circle cx="250" cy="85" r="4" fill="#C084FC"/>
    <circle cx="280" cy="55" r="4" fill="#C084FC"/>
  </g>

  <!-- Right side metric gauges -->
  <g transform="translate(500, 140)">
    <rect width="155" height="50" rx="8" fill="#151A2C" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="22" fill="#94A3B8" font-family="system-ui" font-size="10">CROSS VALIDATION</text>
    <text x="15" y="42" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="bold">K-Fold (k=5)</text>

    <rect y="65" width="155" height="50" rx="8" fill="#151A2C" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="87" fill="#94A3B8" font-family="system-ui" font-size="10">FEATURE SCALING</text>
    <text x="15" y="107" fill="#34D399" font-family="monospace" font-size="14" font-weight="bold">StandardScaler</text>

    <rect y="130" width="155" height="50" rx="8" fill="#151A2C" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="152" fill="#94A3B8" font-family="system-ui" font-size="10">MODEL EVALUATION</text>
    <text x="15" y="172" fill="#F472B6" font-family="monospace" font-size="14" font-weight="bold">Conf. Matrix</text>
  </g>
</svg>
