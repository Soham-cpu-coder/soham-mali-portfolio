<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E18"/>
      <stop offset="100%" stop-color="#141829"/>
    </linearGradient>
    <linearGradient id="ss-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="ss-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#ss-bg)"/>
  <rect width="800" height="450" fill="url(#ss-grid)"/>

  <!-- Browser window frame -->
  <rect x="130" y="60" width="540" height="330" rx="14" fill="#0F1322" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Browser Header -->
  <rect x="130" y="60" width="540" height="38" rx="14" fill="#161B2E"/>
  <circle cx="155" cy="79" r="5" fill="#EF4444"/>
  <circle cx="170" cy="79" r="5" fill="#F59E0B"/>
  <circle cx="185" cy="79" r="5" fill="#10B981"/>
  <rect x="230" y="69" width="340" height="20" rx="10" fill="#0C0E17"/>
  <text x="400" y="83" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">https://the-ultimate-sport-store.local</text>

  <!-- Store Navigation -->
  <rect x="150" y="115" width="500" height="36" rx="6" fill="#141828"/>
  <text x="170" y="137" fill="#FFFFFF" font-family="system-ui" font-size="12" font-weight="bold">THE ULTIMATE SPORT STORE</text>
  <text x="440" y="137" fill="#94A3B8" font-family="system-ui" font-size="10">Catalog</text>
  <text x="500" y="137" fill="#94A3B8" font-family="system-ui" font-size="10">Orders</text>
  <rect x="560" y="122" width="75" height="22" rx="4" fill="#2563EB"/>
  <text x="597" y="137" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Cart (3)</text>

  <!-- Product Catalog Cards Grid -->
  <g transform="translate(150, 165)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="155" height="190" rx="8" fill="#141828" stroke="rgba(255,255,255,0.06)"/>
    <rect x="10" y="10" width="135" height="85" rx="6" fill="#1C2237"/>
    <circle cx="77" cy="52" r="24" fill="#3B82F6" opacity="0.3"/>
    <text x="15" y="115" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Pro Grip Basketball</text>
    <text x="15" y="132" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">$49.99</text>
    <rect x="15" y="145" width="125" height="24" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="77" y="161" fill="#E2E8F0" font-family="system-ui" font-size="9" text-anchor="middle">Add to Cart</text>

    <!-- Item 2 -->
    <rect x="170" y="0" width="155" height="190" rx="8" fill="#141828" stroke="rgba(255,255,255,0.06)"/>
    <rect x="180" y="10" width="135" height="85" rx="6" fill="#1C2237"/>
    <circle cx="247" cy="52" r="24" fill="#10B981" opacity="0.3"/>
    <text x="185" y="115" fill="#FFFFFF" font-family="system-ui" font-size="11" font-weight="600">Speed Runner Shoes</text>
    <text x="185" y="132" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">$119.00</text>
    <rect x="185" y="145" width="125" height="24" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="247" y="161" fill="#E2E8F0" font-family="system-ui" font-size="9" text-anchor="middle">Add to Cart</text>

    <!-- Item 3 / MySQL Checkout Summary -->
    <rect x="340" y="0" width="160" height="190" rx="8" fill="#111624" stroke="rgba(59,130,246,0.3)"/>
    <text x="355" y="24" fill="#60A5FA" font-family="monospace" font-size="10" font-weight="bold">CHECKOUT SUMMARY</text>
    <line x1="355" y1="36" x2="485" y2="36" stroke="rgba(255,255,255,0.08)"/>
    <text x="355" y="55" fill="#94A3B8" font-family="system-ui" font-size="10">Subtotal: $168.99</text>
    <text x="355" y="75" fill="#94A3B8" font-family="system-ui" font-size="10">Tax (8%): $13.52</text>
    <text x="355" y="102" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold">TOTAL: $182.51</text>
    <rect x="355" y="125" width="130" height="28" rx="4" fill="#2563EB"/>
    <text x="420" y="143" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Order in MySQL</text>
  </g>
</svg>
