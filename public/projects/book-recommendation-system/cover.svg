<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="br-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="br-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="br-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#br-bg)"/>
  <rect width="800" height="450" fill="url(#br-grid)"/>

  <!-- Main System Card -->
  <rect x="130" y="60" width="540" height="330" rx="14" fill="#0E121E" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="130" y="60" width="540" height="40" rx="14" fill="#141928"/>
  <circle cx="155" cy="80" r="5" fill="#EF4444"/>
  <circle cx="170" cy="80" r="5" fill="#F59E0B"/>
  <circle cx="185" cy="80" r="5" fill="#10B981"/>
  <text x="400" y="84" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Book_Recommendation_Engine.py • Collaborative Filtering</text>

  <!-- Left: Recommendation Pipeline Matrix -->
  <g transform="translate(160, 125)">
    <rect width="230" height="235" rx="10" fill="#131726" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="25" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="bold">USER-ITEM MATRIX</text>
    
    <!-- Matrix Grid visual -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="45" height="26" rx="4" fill="rgba(59,130,246,0.2)"/>
      <text x="22" y="17" fill="#93C5FD" font-family="monospace" font-size="10" text-anchor="middle">4.8 ★</text>

      <rect x="52" y="0" width="45" height="26" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="74" y="17" fill="#6EE7B7" font-family="monospace" font-size="10" text-anchor="middle">5.0 ★</text>

      <rect x="104" y="0" width="45" height="26" rx="4" fill="rgba(255,255,255,0.05)"/>
      <text x="126" y="17" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">--</text>

      <rect x="156" y="0" width="45" height="26" rx="4" fill="rgba(59,130,246,0.15)"/>
      <text x="178" y="17" fill="#93C5FD" font-family="monospace" font-size="10" text-anchor="middle">4.2 ★</text>

      <!-- Row 2 -->
      <rect x="0" y="34" width="45" height="26" rx="4" fill="rgba(255,255,255,0.05)"/>
      <text x="22" y="51" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">--</text>

      <rect x="52" y="34" width="45" height="26" rx="4" fill="rgba(59,130,246,0.25)"/>
      <text x="74" y="51" fill="#93C5FD" font-family="monospace" font-size="10" text-anchor="middle">4.9 ★</text>

      <rect x="104" y="34" width="45" height="26" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="126" y="51" fill="#6EE7B7" font-family="monospace" font-size="10" text-anchor="middle">4.7 ★</text>

      <rect x="156" y="34" width="45" height="26" rx="4" fill="rgba(255,255,255,0.05)"/>
      <text x="178" y="51" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">--</text>
    </g>

    <text x="15" y="130" fill="#94A3B8" font-family="system-ui" font-size="10">SIMILARITY SCORING</text>
    <rect x="15" y="145" width="200" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="15" y="145" width="168" height="8" rx="4" fill="#3B82F6"/>

    <text x="15" y="175" fill="#94A3B8" font-family="system-ui" font-size="10">COSINE SIMILARITY: 0.89</text>
  </g>

  <!-- Right: Top Ranked Recommendations -->
  <g transform="translate(410, 125)">
    <rect width="235" height="235" rx="10" fill="#131726" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="25" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold">TOP RECOMMENDATIONS</text>

    <!-- Book 1 -->
    <rect x="15" y="42" width="205" height="48" rx="6" fill="#181E30"/>
    <rect x="25" y="50" width="22" height="32" rx="3" fill="#2563EB"/>
    <text x="55" y="62" fill="#F8FAFC" font-family="system-ui" font-size="11" font-weight="600">Introduction to Algorithms</text>
    <text x="55" y="78" fill="#94A3B8" font-family="monospace" font-size="9">Match Confidence: 94%</text>

    <!-- Book 2 -->
    <rect x="15" y="98" width="205" height="48" rx="6" fill="#181E30"/>
    <rect x="25" y="106" width="22" height="32" rx="3" fill="#7C3AED"/>
    <text x="55" y="118" fill="#F8FAFC" font-family="system-ui" font-size="11" font-weight="600">Designing Data-Intensive Apps</text>
    <text x="55" y="134" fill="#94A3B8" font-family="monospace" font-size="9">Match Confidence: 91%</text>

    <!-- MySQL database pill -->
    <rect x="15" y="160" width="205" height="42" rx="6" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)"/>
    <text x="117" y="185" fill="#34D399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MySQL PERSISTENCE: CONNECTED</text>
  </g>
</svg>
