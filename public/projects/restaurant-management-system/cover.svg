<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="rm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="rm-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="rm-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#rm-bg)"/>
  <rect width="800" height="450" fill="url(#rm-grid)"/>

  <!-- Desktop window frame -->
  <rect x="140" y="60" width="520" height="330" rx="12" fill="#10141F" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="140" y="60" width="520" height="36" rx="12" fill="#171C2B"/>
  <circle cx="165" cy="78" r="5" fill="#EF4444"/>
  <circle cx="180" cy="78" r="5" fill="#F59E0B"/>
  <circle cx="195" cy="78" r="5" fill="#10B981"/>
  <text x="400" y="82" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Restaurant_Manager.py — Tkinter &amp; MySQL</text>

  <!-- Left Sidebar (Menu Categories) -->
  <rect x="160" y="115" width="140" height="250" rx="6" fill="#151928" stroke="rgba(255,255,255,0.06)"/>
  <rect x="175" y="135" width="110" height="20" rx="4" fill="#1E293B"/>
  <rect x="175" y="165" width="90" height="14" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="175" y="190" width="100" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="175" y="215" width="80" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="175" y="240" width="95" height="14" rx="3" fill="rgba(255,255,255,0.06)"/>

  <!-- Middle Area (Order Items Table) -->
  <rect x="315" y="115" width="190" height="250" rx="6" fill="#151928" stroke="rgba(255,255,255,0.06)"/>
  <rect x="330" y="135" width="160" height="20" rx="4" fill="#1E293B"/>
  <line x1="330" y1="170" x2="490" y2="170" stroke="rgba(255,255,255,0.08)"/>
  <line x1="330" y1="200" x2="490" y2="200" stroke="rgba(255,255,255,0.08)"/>
  <line x1="330" y1="230" x2="490" y2="230" stroke="rgba(255,255,255,0.08)"/>
  <line x1="330" y1="260" x2="490" y2="260" stroke="rgba(255,255,255,0.08)"/>

  <!-- Right Sidebar (Live Invoice & Database) -->
  <rect x="520" y="115" width="120" height="250" rx="6" fill="#121624" stroke="rgba(59,130,246,0.3)"/>
  <text x="580" y="145" fill="#60A5FA" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">BILL SUMMARY</text>
  <rect x="535" y="165" width="90" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="535" y="185" width="70" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="535" y="205" width="80" height="8" rx="2" fill="rgba(255,255,255,0.1)"/>
  <line x1="535" y1="230" x2="625" y2="230" stroke="rgba(59,130,246,0.4)"/>
  <text x="580" y="255" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PAID / MySQL</text>
  <rect x="535" y="280" width="90" height="26" rx="4" fill="#2563EB"/>
  <text x="580" y="297" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">PRINT BILL</text>
</svg>
