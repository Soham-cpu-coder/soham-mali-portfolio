<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="hm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="100%" stop-color="#141728"/>
    </linearGradient>
    <linearGradient id="hm-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <pattern id="hm-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#hm-bg)"/>
  <rect width="800" height="450" fill="url(#hm-grid)"/>

  <!-- Java Swing Window Frame -->
  <rect x="130" y="60" width="540" height="330" rx="14" fill="#0E121E" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="130" y="60" width="540" height="38" rx="14" fill="#151A2C"/>
  <circle cx="155" cy="79" r="5" fill="#EF4444"/>
  <circle cx="170" cy="79" r="5" fill="#F59E0B"/>
  <circle cx="185" cy="79" r="5" fill="#10B981"/>
  <text x="400" y="83" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">HotelManagementSystem.java — OOP &amp; MySQL</text>

  <!-- Left: Room Grid Visual -->
  <g transform="translate(155, 120)">
    <rect width="240" height="245" rx="8" fill="#121626" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="24" fill="#A78BFA" font-family="monospace" font-size="11" font-weight="bold">ROOM OCCUPANCY MATRIX</text>

    <!-- Rooms -->
    <g transform="translate(15, 40)">
      <!-- Room 101 -->
      <rect x="0" y="0" width="60" height="42" rx="4" fill="rgba(239,68,68,0.2)" stroke="rgba(239,68,68,0.4)"/>
      <text x="30" y="20" fill="#F87171" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">101</text>
      <text x="30" y="34" fill="#FCA5A5" font-family="system-ui" font-size="8" text-anchor="middle">Booked</text>

      <!-- Room 102 -->
      <rect x="72" y="0" width="60" height="42" rx="4" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)"/>
      <text x="102" y="20" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">102</text>
      <text x="102" y="34" fill="#6EE7B7" font-family="system-ui" font-size="8" text-anchor="middle">Vacant</text>

      <!-- Room 103 -->
      <rect x="144" y="0" width="60" height="42" rx="4" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)"/>
      <text x="174" y="20" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">103</text>
      <text x="174" y="34" fill="#6EE7B7" font-family="system-ui" font-size="8" text-anchor="middle">Vacant</text>

      <!-- Room 201 -->
      <rect x="0" y="55" width="60" height="42" rx="4" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)"/>
      <text x="30" y="75" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">201</text>
      <text x="30" y="89" fill="#6EE7B7" font-family="system-ui" font-size="8" text-anchor="middle">Vacant</text>

      <!-- Room 202 -->
      <rect x="72" y="55" width="60" height="42" rx="4" fill="rgba(239,68,68,0.2)" stroke="rgba(239,68,68,0.4)"/>
      <text x="102" y="75" fill="#F87171" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">202</text>
      <text x="102" y="89" fill="#FCA5A5" font-family="system-ui" font-size="8" text-anchor="middle">Booked</text>

      <!-- Room 203 -->
      <rect x="144" y="55" width="60" height="42" rx="4" fill="rgba(59,130,246,0.2)" stroke="rgba(59,130,246,0.4)"/>
      <text x="174" y="75" fill="#60A5FA" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">203</text>
      <text x="174" y="89" fill="#93C5FD" font-family="system-ui" font-size="8" text-anchor="middle">Suite</text>
    </g>

    <rect x="15" y="160" width="210" height="34" rx="4" fill="#181D30"/>
    <text x="25" y="181" fill="#94A3B8" font-family="monospace" font-size="10">Active Check-ins: 14</text>
  </g>

  <!-- Right: Guest Record & Billing Module -->
  <g transform="translate(415, 120)">
    <rect width="235" height="245" rx="8" fill="#121626" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="24" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="bold">BILLING &amp; CHECK-OUT</text>

    <rect x="15" y="42" width="205" height="24" rx="4" fill="#181E32"/>
    <text x="25" y="58" fill="#E2E8F0" font-family="system-ui" font-size="10">Guest: John D. (Room 101)</text>

    <rect x="15" y="75" width="205" height="24" rx="4" fill="#181E32"/>
    <text x="25" y="91" fill="#94A3B8" font-family="monospace" font-size="10">Stay: 3 Nights @ $120/night</text>

    <line x1="15" y1="115" x2="220" y2="115" stroke="rgba(255,255,255,0.1)"/>
    <text x="15" y="138" fill="#34D399" font-family="monospace" font-size="13" font-weight="bold">TOTAL DUE: $360.00</text>

    <rect x="15" y="155" width="205" height="30" rx="4" fill="#7C3AED"/>
    <text x="117" y="174" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">GENERATE RECEIPT</text>

    <rect x="15" y="195" width="205" height="30" rx="4" fill="rgba(255,255,255,0.05)"/>
    <text x="117" y="214" fill="#94A3B8" font-family="system-ui" font-size="10" text-anchor="middle">Save Record to MySQL</text>
  </g>
</svg>
