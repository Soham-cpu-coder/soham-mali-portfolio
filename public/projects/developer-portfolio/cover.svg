<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="dp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#111422"/>
    </linearGradient>
    <linearGradient id="dp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="dp-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#dp-bg)"/>
  <rect width="800" height="450" fill="url(#dp-grid)"/>

  <!-- Terminal Window Shell -->
  <rect x="130" y="55" width="540" height="340" rx="12" fill="#0C0E17" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="130" y="55" width="540" height="38" rx="12" fill="#141724"/>
  <circle cx="155" cy="74" r="5" fill="#EF4444"/>
  <circle cx="170" cy="74" r="5" fill="#F59E0B"/>
  <circle cx="185" cy="74" r="5" fill="#10B981"/>
  <text x="400" y="78" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">soham@terminal: ~ (zsh)</text>

  <!-- Terminal output -->
  <g transform="translate(160, 120)">
    <text x="0" y="0" fill="#3B82F6" font-family="monospace" font-size="13" font-weight="bold">$</text>
    <text x="18" y="0" fill="#F8FAFC" font-family="monospace" font-size="13">whoami</text>
    <text x="0" y="24" fill="#94A3B8" font-family="monospace" font-size="12">Soham Mali — Full Stack Developer &amp; CE Student</text>

    <text x="0" y="60" fill="#3B82F6" font-family="monospace" font-size="13" font-weight="bold">$</text>
    <text x="18" y="60" fill="#F8FAFC" font-family="monospace" font-size="13">skills --summary</text>
    <text x="0" y="84" fill="#60A5FA" font-family="monospace" font-size="12">Languages: Python, C++, TypeScript, JavaScript</text>
    <text x="0" y="104" fill="#A78BFA" font-family="monospace" font-size="12">Full-Stack: Next.js 15, React, REST APIs, MySQL, MongoDB</text>
    <text x="0" y="124" fill="#34D399" font-family="monospace" font-size="12">AI/ML: NLP, Scikit-learn, Pandas, NumPy</text>

    <text x="0" y="160" fill="#3B82F6" font-family="monospace" font-size="13" font-weight="bold">$</text>
    <text x="18" y="160" fill="#F8FAFC" font-family="monospace" font-size="13">portfolio status</text>
    <text x="0" y="184" fill="#10B981" font-family="monospace" font-size="12">✓ Ready for Full-Stack &amp; AI/ML Internships</text>

    <text x="0" y="220" fill="#3B82F6" font-family="monospace" font-size="13" font-weight="bold">$</text>
    <rect x="18" y="208" width="8" height="15" fill="#38BDF8"/>
  </g>
</svg>
