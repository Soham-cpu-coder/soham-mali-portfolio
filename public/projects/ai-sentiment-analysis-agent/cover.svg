<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Neural node connections -->
  <g stroke="rgba(59,130,246,0.2)" stroke-width="1.5">
    <line x1="160" y1="225" x2="280" y2="160"/>
    <line x1="160" y1="225" x2="280" y2="290"/>
    <line x1="280" y1="160" x2="420" y2="190"/>
    <line x1="280" y1="290" x2="420" y2="260"/>
    <line x1="420" y1="190" x2="560" y2="160"/>
    <line x1="420" y1="260" x2="560" y2="290"/>
    <line x1="560" y1="160" x2="660" y2="225"/>
    <line x1="560" y1="290" x2="660" y2="225"/>
  </g>

  <!-- Sentiment Waveforms -->
  <path d="M 120 340 Q 240 280 360 350 T 600 320 T 720 340" fill="none" stroke="url(#cyan-violet)" stroke-width="2.5" opacity="0.6"/>

  <!-- Nodes -->
  <circle cx="160" cy="225" r="10" fill="#1E293B" stroke="#3B82F6" stroke-width="3"/>
  <circle cx="280" cy="160" r="8" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="280" cy="290" r="8" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
  <circle cx="420" cy="190" r="14" fill="#0F172A" stroke="url(#cyan-violet)" stroke-width="3"/>
  <circle cx="420" cy="260" r="12" fill="#0F172A" stroke="url(#cyan-violet)" stroke-width="2"/>
  <circle cx="560" cy="160" r="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="560" cy="290" r="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="660" cy="225" r="10" fill="#1E293B" stroke="#A78BFA" stroke-width="3"/>

  <!-- Central badge card -->
  <rect x="250" y="70" width="300" height="42" rx="21" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.12)"/>
  <text x="400" y="96" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">NATURAL LANGUAGE PROCESSING • NLP</text>

  <!-- Polarity meters -->
  <g transform="translate(260, 375)">
    <rect width="80" height="20" rx="10" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)"/>
    <text x="40" y="14" fill="#4ADE80" font-family="monospace" font-size="10" text-anchor="middle">+ POSITIVE</text>
  </g>
  <g transform="translate(360, 375)">
    <rect width="80" height="20" rx="10" fill="rgba(148,163,184,0.15)" stroke="rgba(148,163,184,0.3)"/>
    <text x="40" y="14" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">NEUTRAL</text>
  </g>
  <g transform="translate(460, 375)">
    <rect width="80" height="20" rx="10" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.4)"/>
    <text x="40" y="14" fill="#F87171" font-family="monospace" font-size="10" text-anchor="middle">- NEGATIVE</text>
  </g>
</svg>
