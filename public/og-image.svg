<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#111422"/>
    </linearGradient>
    <linearGradient id="og-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <pattern id="og-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-grid)"/>

  <!-- Glowing orb behind brand -->
  <circle cx="200" cy="180" r="160" fill="#3B82F6" opacity="0.12" filter="blur(60px)"/>
  <circle cx="950" cy="400" r="180" fill="#8B5CF6" opacity="0.10" filter="blur(70px)"/>

  <!-- Monogram Logo -->
  <rect x="100" y="100" width="64" height="64" rx="32" fill="url(#og-accent)"/>
  <text x="132" y="140" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle">SM</text>

  <!-- Tagline / Status badge -->
  <rect x="180" y="112" width="230" height="40" rx="20" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)"/>
  <circle cx="202" cy="132" r="5" fill="#10B981"/>
  <text x="216" y="137" fill="#34D399" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Open to Internships</text>

  <!-- Main Headline -->
  <text x="100" y="270" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Soham Mali</text>
  <text x="100" y="335" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="34" font-weight="600">Full Stack Developer &amp; Computer Engineering Student</text>

  <!-- Subtitle -->
  <text x="100" y="400" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="22" font-weight="400">Engineering scalable web applications &amp; intelligent AI/ML models.</text>

  <!-- Tech tags bar -->
  <g transform="translate(100, 470)">
    <rect width="110" height="38" rx="8" fill="#141828" stroke="rgba(255,255,255,0.1)"/>
    <text x="55" y="24" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">Python</text>

    <rect x="125" width="110" height="38" rx="8" fill="#141828" stroke="rgba(255,255,255,0.1)"/>
    <text x="180" y="24" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">Next.js</text>

    <rect x="250" width="125" height="38" rx="8" fill="#141828" stroke="rgba(255,255,255,0.1)"/>
    <text x="312" y="24" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">TypeScript</text>

    <rect x="390" width="110" height="38" rx="8" fill="#141828" stroke="rgba(255,255,255,0.1)"/>
    <text x="445" y="24" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">AI / ML</text>

    <rect x="515" width="110" height="38" rx="8" fill="#141828" stroke="rgba(255,255,255,0.1)"/>
    <text x="570" y="24" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">MySQL</text>
  </g>
</svg>
